# entry id == package.json name == client.js load().id
# 三处必须完全一致，否则页面白屏。
- insert:
    - id: dsh-progress
      name: dsh-progress
      config:
        # 连续多少次工具调用没汇报时提醒一次（软提醒）
        softLimit: 7
        # 连续多少次没汇报后，下一次工具调用被拒绝（硬拦截）
        hardLimit: 10
        # 连续多少次工具调用失败仍没汇报，也要拦一下，逼模型说明问题
        failuresBeforeBlock: 3
        # 偏离目标时提醒/拉回（不调用任何模型，只做规则判断）
        direction: true
        # 工具使用教练（bash 包装命令、完成未验证等即时提示）
        coach: true
        # 每回合最多拉回几次；0 = 只核对不拉回
        maxCorrections: 2
        # 清晰目标连续多少次没成功写入时开始核对
        noWriteLimit: 8
